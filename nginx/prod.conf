upstream odoo {
    server odoo:8069;
}

upstream odoo-gevent {
    server odoo:8072;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Uzun bağlantılar için timeout
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    # Büyük dosya yükleme desteği
    client_max_body_size 200m;

    # WebSocket desteği (Odoo longpolling — gevent port 8072)
    location /websocket {
        proxy_pass http://odoo-gevent;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # WebSocket uzun süreli bağlantı — 24 saat timeout
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Gerçek zamanlı veri akışı için buffering kapalı
        proxy_buffering off;
    }

    # Tüm istekler → Odoo
    location / {
        proxy_pass http://odoo;
        proxy_redirect off;
    }

    # Statik dosyalar cache
    location ~* /web/static/ {
        proxy_pass http://odoo;
        proxy_cache_valid 200 60m;
        expires 24h;
        add_header Cache-Control "public, immutable";
    }
}
