[options]
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_name = ugurlar
dbfilter = ^ugurlar$
admin_passwd = Ugurlar#2026!MasterShield
list_db = False
http_port = 8069
; logfile = /var/log/odoo/odoo.log
log_level = info
proxy_mode = True

; === Worker Yapılandırması (OOM çökmelerini önler) ===
; Tek süreçli mod (workers=0) yerine çoklu süreç modu.
; Bir cron bellek limitini aşarsa SADECE o worker süreci öldürülür,
; ana Odoo süreci ve HTTP servisi çalışmaya devam eder.
workers = 10
max_cron_threads = 6
limit_memory_soft = 4294967296
limit_memory_hard = 5368709120
limit_time_cpu = 1200
limit_time_real = 2400
gevent_port = 8072
