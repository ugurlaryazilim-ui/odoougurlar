services:
  db:
    image: postgres:16
    container_name: odoougurlar-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-odoo}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    build: .
    container_name: odoougurlar-odoo-prod
    restart: unless-stopped
    command: odoo -i ugurlar_images,ugurlar_ai_studio -u ugurlar_images,ugurlar_ai_studio -d ugurlar
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    # Canlı bildirim (bus/websocket) çok işçili modda ayrı gevent portundan (8072) açılır
    expose:
      - "8072"
    labels:
      # Coolify'ın Traefik'i /websocket isteklerini 8072'ye, diğer her şeyi 8069'a yönlendirir
      - "traefik.http.routers.odoo-ws.rule=Host(`odoo.ugurlar.com`) && PathPrefix(`/websocket`)"
      - "traefik.http.routers.odoo-ws.entrypoints=https"
      - "traefik.http.routers.odoo-ws.tls=true"
      - "traefik.http.routers.odoo-ws.tls.certresolver=letsencrypt"
      - "traefik.http.routers.odoo-ws.service=odoo-ws"
      - "traefik.http.services.odoo-ws.loadbalancer.server.port=8072"
    volumes:
      - odoo-data:/var/lib/odoo
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${DB_PASSWORD:-odoo}

volumes:
  db-data:
  odoo-data:
